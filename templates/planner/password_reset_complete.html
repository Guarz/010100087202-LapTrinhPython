<!-- templates/planner/password_reset_complete.html -->
{% extends 'planner/_auth_layout.html' %}

{% block title %}Đã đặt lại mật khẩu - StudyPlanner{% endblock %}

{% block auth_form %}
<div class="mx-auto max-w-sm space-y-6 text-center">
    <span class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-emerald-50 text-2xl text-emerald-600"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
    <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Đã đặt lại mật khẩu</h1>
        <p class="mt-2 text-sm text-slate-500">Bạn có thể đăng nhập bằng mật khẩu mới.</p>
    </div>
    <a href="{% url 'login' %}" class="btn-primary w-full py-3">Đăng nhập</a>
</div>
{% endblock %}
