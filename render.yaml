# Render Blueprint: Dashboard -> New -> Blueprint -> chọn repo này.
#
# Gói miễn phí: 1 web service (Django + FastAPI qua uvicorn).
# - Database: PostgreSQL trên Supabase (DATABASE_URL = Session pooler).
# - Celery chạy eager trong web (không có REDIS_URL). Nhắc deadline định kỳ:
#   dịch vụ cron ngoài (VD cron-job.org) gọi POST /internal/cron/reminders/
#   mỗi 15 phút với header X-Cron-Secret = CRON_SECRET.
# - Muốn chạy Celery worker + Redis thật (trả phí): xem khối chú thích cuối file.
services:
  - type: web
    name: ai-study-planner
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: uvicorn core.asgi:application --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/v2/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL          # Supabase Session pooler
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM             # sender đã xác minh trên Brevo
        sync: false
      - key: MAIL_FROM_NAME
        value: StudyPlanner

