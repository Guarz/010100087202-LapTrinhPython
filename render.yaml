# Render Blueprint: Dashboard -> New -> Blueprint -> chọn repo này.
#
# Toàn bộ trên gói miễn phí:
# - Web service: uvicorn (Django + FastAPI) + Celery worker & beat chạy nền
#   trong cùng container (start.sh), vì worker riêng của Render phải trả phí.
# - Key Value (Redis): broker + result backend cho Celery.
# - Database: PostgreSQL trên Supabase (DATABASE_URL = Session pooler).
# Web free tự ngủ sau 15 phút không có request; dùng cron-job.org gọi
# /api/v2/health mỗi 10-15 phút để giữ web (và Celery beat) luôn chạy.
services:
  - type: keyvalue
    name: studyplanner-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction   # hàng đợi job không được tự xóa
    ipAllowList: []               # chỉ cho dịch vụ nội bộ Render truy cập

  - type: web
    name: ai-study-planner
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/v2/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL          # Supabase Session pooler
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studyplanner-redis
          property: connectionString
      - key: CRON_SECRET           # cho endpoint dự phòng /internal/cron/reminders/
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM             # sender đã xác minh trên Brevo
        sync: false
      - key: MAIL_FROM_NAME
        value: StudyPlanner
