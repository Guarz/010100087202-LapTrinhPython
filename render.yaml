# Render Blueprint: Dashboard -> New -> Blueprint -> chọn repo này.
databases:
  - name: studyplanner-db
    plan: free
    databaseName: studyplanner
    user: studyplanner

services:
  - type: redis
    name: studyplanner-redis
    plan: free
    ipAllowList: []

  - type: web
    name: ai-study-planner
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: uvicorn core.asgi:application --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v2/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: studyplanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyplanner-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

  # Celery worker + beat: gửi email nhắc deadline mỗi 15 phút.
  # (Gói free của Render không có background worker; khi đó dùng
  #  cron job chạy `python manage.py send_deadline_reminders`.)
  - type: worker
    name: ai-study-planner-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A core worker -B -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: studyplanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyplanner-redis
          property: connectionString
